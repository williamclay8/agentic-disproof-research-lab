name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRADING_LAB_DISABLE_NETWORK: "1"
      TRADING_LAB_DISABLE_REALTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pytest -q
