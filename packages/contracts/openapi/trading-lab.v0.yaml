openapi: 3.1.0
info:
  title: Trading Lab Research API
  version: 0.0.1
  description: >
    Research-only API contract for local Trading Lab product development. This
    contract exposes evidence artifacts and market-observation snapshots. It
    does not expose advice, broker, account, order, fill, or execution routes.
paths:
  /health:
    get:
      summary: Service health and product boundary
      responses:
        "200":
          description: API is available
  /runs/example:
    get:
      summary: Read the bundled example research run
      responses:
        "200":
          description: Example research run evidence
  /snapshots/latest:
    get:
      summary: Read the latest bounded market-observation snapshot
      responses:
        "200":
          description: Snapshot events with provenance metadata
  /terminal/overview:
    get:
      summary: Read the compact ranked falsification terminal overview
      responses:
        "200":
          description: Research-only attention queue, evidence summary, observation provenance, claim_journey, and product_release_rule answers
  /control-plane/lab:
    get:
      summary: Read the research lab control plane
      responses:
        "200":
          description: Research-only missions, evidence gaps, claim lifecycle, task board, scorecard, and learning loop
  /platform/overview:
    get:
      summary: Read the full agentic claim-disproof platform overview
      responses:
        "200":
          description: Research-only wedge payload spanning claim registry, evidence graph, falsification packs, readiness ledger, trust packet, claim_journey, product_release_rule answers, and research_development_pass
  /claims:
    get:
      summary: Read the claim registry
      responses:
        "200":
          description: Research-only registered claims and run references
  /claims/{claim_id}:
    get:
      summary: Read one registered claim and its evidence runs
      parameters:
        - name: claim_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Research-only claim detail and trust packet reference
        "404":
          description: Claim id was not found
  /evidence-graph/current:
    get:
      summary: Read the current evidence graph
      responses:
        "200":
          description: Research-only graph of claims, runs, gates, gaps, readiness, and source references
  /point-in-time-contract/current:
    get:
      summary: Read the current point-in-time evidence contract
      responses:
        "200":
          description: Known-at-time field policy, lineage gaps, baseline gaps, and dataset window
  /falsification-engine/current:
    get:
      summary: Read active falsification packs and tasks
      responses:
        "200":
          description: Research-only disproof packs and open offline test queue
  /agent-contracts:
    get:
      summary: Read agent evidence contracts
      responses:
        "200":
          description: Offline agent roles, boundaries, input schema, and output schema
  /readiness/ledger:
    get:
      summary: Read the promotion-readiness ledger
      responses:
        "200":
          description: Research-only readiness checks, artifacts, sample thresholds, and current stage
  /trust-packet/current:
    get:
      summary: Read the current research trust packet
      responses:
        "200":
          description: Export-ready research review packet with source refs and open blockers
  /strategy-import/contract:
    get:
      summary: Read the validate-only strategy import contract
      responses:
        "200":
          description: Supported research-source imports and blocked execution fields
  /strategy-import/preview:
    post:
      summary: Preview a validate-only strategy import draft
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source_type:
                  type: string
                raw_text:
                  type: string
                source_ref:
                  type: string
      responses:
        "200":
          description: Quarantined research draft, missing fields, blocked terms, and first falsification tasks
        "400":
          description: Invalid preview request body
  /strategy-import/example-preview:
    get:
      summary: Read a bundled validate-only strategy import preview
      responses:
        "200":
          description: Example quarantined research draft for UI preview and local smoke checks
  /failure-gallery:
    get:
      summary: Read failed or blocked claim gallery
      responses:
        "200":
          description: Research-only archive of dead, blocked, and lesson-bearing claims
  /research-development/pass:
    get:
      summary: Read the eight-step research and development pass
      responses:
        "200":
          description: Research-only action-native first move, baseline_ledger, walk_forward_ledger, point_in_time_proof, agent_reviewer_artifacts, failure_gallery, readiness_evidence, and hardened_response_schemas
  /confidence/readiness:
    get:
      summary: Read evidence maturity gates for future setup visibility
      responses:
        "200":
          description: Research-only confidence readiness stages and missing proof
  /readiness/artifacts:
    get:
      summary: Read local paper, shadow, calibration, and risk evidence artifacts
      responses:
        "200":
          description: Research-only readiness artifact status and source paths
  /agentic/review:
    get:
      summary: Read deterministic research-agent review of the current evidence
      responses:
        "200":
          description: Research-only agent roles, findings, next actions, and promotion decision
  /evidence/rigor:
    get:
      summary: Read point-in-time, leakage, and baseline-pack evidence rigor summary
      responses:
        "200":
          description: Research-only evidence rigor score, gaps, and baseline descriptors
components:
  schemas:
    ProductReleaseRule:
      type: object
      description: Four answers every Trading Lab release surface must expose before it is shippable.
      required:
        - current_research_state
        - plain_english_meaning
        - missing_proof
        - next_safe_research_action
      properties:
        current_research_state:
          type: string
        plain_english_meaning:
          type: string
        missing_proof:
          type: string
        next_safe_research_action:
          type: string
    ClaimJourney:
      type: object
      description: Six-step research-only journey from claim framing to next falsification test.
      required:
        - mode
        - steps
      properties:
        mode:
          type: string
          const: research_only
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ClaimJourneyStep"
    ClaimJourneyStep:
      type: object
      required:
        - step_number
        - id
        - title
        - question
        - current_research_state
        - plain_english_meaning
        - missing_proof
        - next_safe_research_action
        - source_ref
      properties:
        step_number:
          type: integer
        id:
          type: string
          enum:
            - what_are_we_testing
            - simple_baseline
            - fooling_risks
            - evidence_origin
            - research_readiness
            - next_research_test
        title:
          type: string
        question:
          type: string
        current_research_state:
          type: string
        plain_english_meaning:
          type: string
        missing_proof:
          type: string
        next_safe_research_action:
          type: string
        source_ref:
          type: string
    ResearchDevelopmentPass:
      type: object
      description: Eight-step R&D pass for product, API, UI, and contract release surfaces.
      required:
        - mode
        - schema_version
        - boundary
        - steps
        - forbidden_outputs
      properties:
        mode:
          type: string
          const: research_only
        schema_version:
          type: string
          const: research_development_pass.v1
        boundary:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ResearchDevelopmentStep"
        forbidden_outputs:
          type: array
          items:
            type: string
        response_schema:
          $ref: "#/components/schemas/HardenedResponseSchema"
    ResearchDevelopmentStep:
      type: object
      required:
        - step_number
        - id
        - title
        - status
        - owner
        - current_research_state
        - visible_api_fields
        - source_refs
        - missing_proof
        - next_safe_research_action
        - response_schema
      properties:
        step_number:
          type: integer
        id:
          type: string
          enum:
            - action_native_first_move
            - baseline_ledger
            - walk_forward_ledger
            - point_in_time_proof
            - agent_reviewer_artifacts
            - failure_gallery
            - readiness_evidence
            - hardened_response_schemas
        title:
          type: string
        status:
          type: string
          enum:
            - ready
            - open
            - blocked
            - needs_review
        owner:
          type: string
        current_research_state:
          type: string
        visible_api_fields:
          type: array
          items:
            type: string
        source_refs:
          type: array
          items:
            type: string
        missing_proof:
          type: string
        next_safe_research_action:
          type: string
        response_schema:
          $ref: "#/components/schemas/HardenedResponseSchema"
    HardenedResponseSchema:
      type: object
      required:
        - name
        - required_fields
      properties:
        name:
          type: string
        required_fields:
          type: array
          items:
            type: string
        forbidden_outputs:
          type: array
          items:
            type: string
